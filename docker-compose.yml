version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: online-school-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在根目录 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-online_school}
      TZ: Asia/Shanghai
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: online-school-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在根目录 .env 中设置 MYSQL_ROOT_PASSWORD}
      DATABASE_NAME: ${MYSQL_DATABASE:-online_school}
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 中设置 JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: 2h
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - '3000:3000'
    depends_on:
      - mysql
    networks:
      - app-network

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: online-school-admin
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - api
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
